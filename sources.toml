# Sequences to ingest into the custom vrs-python refgetstore archive.
#
# CURATION PRINCIPLE (2026-07-07): include only AUTHORITATIVE sources -- the
# documented, well-known distribution point for a given version's data. Prior
# (non-current) release files are fine when they are documented version-specific
# products: NCBI annotation releases, per-patch assembly dirs + assembly_report
# files, and Ensembl per-release archives all qualify. What is NOT allowed is
# scraping the FTP tree for undocumented files that merely happen to contain
# useful data (e.g. the historical knownrefseq GBFF, removed below). Historical
# versions not covered by an authoritative bulk file should be backfilled
# per-accession via eutils / INSDC. See SEQREPO_PARITY.md.
#
# Two entry kinds:
#
#   [[assembly]]  An assembled genome FASTA + matching NCBI assembly_report.txt.
#                 Produces one collection and derives per-sequence aliases
#                 (UCSC chr names, GenBank accns, RefSeq accns) from the
#                 report. The cross-assembly `refseq` and `insdc` namespaces
#                 are populated regardless of the entry's own `namespace`.
#
#   [[seqset]]    A flat FASTA (or sharded set of FASTAs) where the accession
#                 is the FASTA header's first token. Used for NCBI RefSeq
#                 transcript/protein shards. Each shard becomes its own
#                 collection; aliases map header-name -> digest under the
#                 configured namespace.
#
# Assembly fields
#   namespace    Per-assembly alias namespace (e.g. "GRCh38.p14").
#   fasta_url    URL of the genomic FASTA (.fna.gz supported directly by gtars).
#   report_url   URL of the NCBI assembly_report.txt.
#   load_fasta   If true, ingest the FASTA. If false, reuse digests already
#                present in the store (cheap patch fanout).
#   fasta_path   Optional local path override, relative to repo root.
#
# Seqset fields
#   name         Human-readable id for logs + summary.
#   namespace    Alias namespace for every ingested sequence (e.g. "refseq").
#   url_template URL with "{shard}" placeholder, or a plain URL if unsharded.
#   shard_range  [min, max] inclusive integer range substituted into
#                url_template. Omit for a single-file seqset.

[[assembly]]
namespace = "GRCh38"
fasta_url = "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.26_GRCh38/GCF_000001405.26_GRCh38_genomic.fna.gz"
report_url = "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.26_GRCh38/GCF_000001405.26_GRCh38_assembly_report.txt"
load_fasta = true

[[assembly]]
namespace = "GRCh38.p14"
fasta_url = "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.40_GRCh38.p14/GCF_000001405.40_GRCh38.p14_genomic.fna.gz"
report_url = "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.40_GRCh38.p14/GCF_000001405.40_GRCh38.p14_assembly_report.txt"
load_fasta = true

[[assembly]]
namespace = "GRCh37"
fasta_url = "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.13_GRCh37/GCF_000001405.13_GRCh37_genomic.fna.gz"
report_url = "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.13_GRCh37/GCF_000001405.13_GRCh37_assembly_report.txt"
