checksum_manifest_url = "https://ftp.ncbi.nlm.nih.gov/refseq/H_sapiens/RefSeqGene/refseqgene.files.installed"
file_class = "genomic"

# ---------------------------------------------------------------------------
# EBI Locus Reference Genomic (LRG)
# ---------------------------------------------------------------------------
# LRG ids are the stable, frozen reference spellings used by HGVS and ClinVar
# ("LRG_1:g.", "LRG_199t1:c."), so they are required for clients resolving those
# expressions. This is net-new coverage rather than a seqrepo parity gap:
# seqrepo has no LRG namespace at all.
#
# EBI publishes the public set as 1325 standalone LRG_N.fasta files and as one
# aggregate zip of byte-identical members. The aggregate is used so the build
# pins a single immutable artifact instead of 1325 URLs; build_store unpacks it
# to a cached derived FASTA in natural-sorted member order without rewriting any
# header. The set is frozen at release 810 (2021-03-31).
#
# EBI publishes no checksum manifest for this directory, so the lock's SHA-256
# of the downloaded zip is the integrity anchor, as for the refseq_history_*
# entries. Only the public set is ingested — not pending/, stalled/, or
# suppressed/.
#
# Each member holds a genomic record plus its transcripts and proteins. The
# genomic record is ingested as "LRG_1g" (EBI's record id) and additionally
# aliased as "LRG_1", which is how ClinVar and HGVS spell it.
[[seqset]]
name = "lrg_public"
namespace = "lrg"
urls = ["https://ftp.ebi.ac.uk/pub/databases/lrgex/fasta/LRG_public_fasta_files.zip"]
file_class = "lrg_bundle"
format = "lrg_zip"

# ---------------------------------------------------------------------------
# Historical RefSeq transcript and protein versions
# ---------------------------------------------------------------------------
# The current mRNA_Prot shards contain only current accession versions. These
# official per-patch and annotation-release archives retain selected older RNA
# and protein versions for compatibility with clients that request them.
# Identical sequences are deduplicated when the store is built.

