# Sequences to ingest into the custom vrs-python refgetstore archive.
#
# Source policy: every URL must be a documented, version-specific distribution
# from its data provider. The manifest includes selected historical releases
# where they preserve useful accession versions. Do not add undocumented FTP
# artifacts merely because they contain otherwise unavailable sequences.
# Versions absent from an official bulk release should be fetched per accession
# from an authoritative service such as NCBI E-utilities or INSDC.
#
# Two entry kinds:
#
#   [[assembly]]  An assembled genome FASTA + matching NCBI assembly_report.txt.
#                 Produces one collection and derives per-sequence aliases
#                 (UCSC chr names, GenBank accns, RefSeq accns) from the
#                 report. The cross-assembly `refseq` and `insdc` namespaces
#                 are populated regardless of the entry's own `namespace`.
#
#   [[seqset]]    A flat FASTA (or sharded set of FASTAs) where the accession
#                 is the FASTA header's first token. Used for NCBI RefSeq
#                 transcript/protein shards. Each shard becomes its own
#                 collection; aliases map header-name -> digest under the
#                 configured namespace.
#
# Assembly fields
#   namespace    Per-assembly alias namespace (e.g. "GRCh38.p14").
#   fasta_url    URL of the genomic FASTA (.fna.gz supported directly by gtars).
#                Required when load_fasta is true.
#   report_url   URL of the NCBI assembly_report.txt.
#   load_fasta   If true, ingest the FASTA. If false, use the report to add
#                aliases for sequences already present in the store. This
#                supports report-only releases and deliberate alias-only
#                namespaces; fasta_url is not needed or fetched in this mode.
#   fasta_path   Optional local path override, relative to repo root.
#
# Seqset fields
#   name         Human-readable id for logs + summary.
#   namespace    Alias namespace for every ingested sequence (e.g. "refseq").
#   url_template URL with "{shard}" placeholder, or a plain URL if unsharded.
#   shard_range  [min, max] inclusive integer range substituted into
#                url_template. Omit for a single-file seqset.
#   urls         Explicit URL list (mutually exclusive with the other modes).
#   url_pattern  HTTPS URL with a glob in its basename. Requires the companion
#                checksum_manifest_url in the same directory.
#   checksum_manifest_url  NCBI *.files.installed file used for discovery + MD5.

# ---------------------------------------------------------------------------
# NCBI human reference assembly releases
# ---------------------------------------------------------------------------
# Releases are grouped in chronological order so a newly published patch can be
# appended to its assembly's timeline. Each available genomic FASTA is loaded
# to retain sequences, including retired FIX scaffolds, and its report adds the
# aliases used by that release. GRCh37.p11 and GRCh37.p12 are report-only:
# their configured NCBI genomic-FASTA URLs are unavailable, but their reports
# are still published.

