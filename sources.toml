[[seqset]]
name = "refseq_human_rna"
namespace = "refseq"
url_template = "https://ftp.ncbi.nlm.nih.gov/refseq/H_sapiens/mRNA_Prot/human.{shard}.rna.fna.gz"
shard_range = [1, 15]

[[seqset]]
name = "refseq_human_protein"
namespace = "refseq"
url_template = "https://ftp.ncbi.nlm.nih.gov/refseq/H_sapiens/mRNA_Prot/human.{shard}.protein.faa.gz"
shard_range = [1, 15]

# NCBI RefSeqGene genomic sequences (NG_ accessions). These are gene-region
# reference sequences NOT present in the mRNA_Prot shards above; seqrepo's NCBI
# namespace includes them, so they are required for backwards-compatibility.
[[seqset]]
name = "refseq_human_refseqgene"
namespace = "refseq"
url_template = "https://ftp.ncbi.nlm.nih.gov/refseq/H_sapiens/RefSeqGene/refseqgene.{shard}.genomic.fna.gz"
shard_range = [1, 9]

# Ensembl human GRCh38 transcripts + proteins, pinned to release 113
# (October 2024). Bump the release number in all three URLs to update.
# Archive index: https://www.ensembl.org/info/website/archives/
# ENST.N / ENSP.N accessions are content-addressable, so the digests are
# stable across releases; only the version suffixes change.
#
# cdna/ ships protein-coding transcripts; ncrna/ ships non-coding
# transcripts (disjoint ENST space). cds/ is intentionally NOT loaded —
# it reuses the same ENST accessions as cdna/ but with UTRs stripped,
# which would collide in the bulk alias merge.

[[seqset]]
name = "ensembl_human_cdna"
namespace = "ensembl"
url_template = "https://ftp.ensembl.org/pub/release-113/fasta/homo_sapiens/cdna/Homo_sapiens.GRCh38.cdna.all.fa.gz"

[[seqset]]
name = "ensembl_human_ncrna"
namespace = "ensembl"
url_template = "https://ftp.ensembl.org/pub/release-113/fasta/homo_sapiens/ncrna/Homo_sapiens.GRCh38.ncrna.fa.gz"

[[seqset]]
name = "ensembl_human_pep"
namespace = "ensembl"
url_template = "https://ftp.ensembl.org/pub/release-113/fasta/homo_sapiens/pep/Homo_sapiens.GRCh38.pep.all.fa.gz"

# ---------------------------------------------------------------------------
# Historical RefSeq transcript/protein versions (backwards-compat with seqrepo)
# ---------------------------------------------------------------------------
# seqrepo accumulates every accession.version it ever loaded; the current
# mRNA_Prot shards above carry only current versions. NCBI ships past
# annotations as bulk FASTAs in two places: per-patch assembly dirs
# (GCF_000001405.<acc>_GRCh38.p<N>/, the pre-AR109 era) and the annotation-
# release archive (annotation_releases/9606/<release>/). force=false dedups.
#
# This set is MEASURED, not guessed (see probe_source_coverage.py): it covers
# ~83% of missing/superseded RNA and ~89% of protein accessions vs seqrepo
# 2024-12-20. The per-patch dirs do most of the work (only distinct annotations
# kept: orig/p2/p5/p7; p12==AR109 so dropped). Redundant snapshots measured to
# add ~0 were dropped: GRCh37 105.* / RS_2024_09, and recent p14 RS_2023..2025.
# Residual (~17% RNA, mostly old XR_; ~11% protein) is not in any bulk file ->
# eutils backfill or accepted drift. Same-basename files disambiguated by the
# download-cache URL hash.

[[seqset]]
name = "refseq_history_rna"
namespace = "refseq"
urls = [
  "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.26_GRCh38/GCF_000001405.26_GRCh38_rna.fna.gz",
  "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.28_GRCh38.p2/GCF_000001405.28_GRCh38.p2_rna.fna.gz",
  "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.31_GRCh38.p5/GCF_000001405.31_GRCh38.p5_rna.fna.gz",
