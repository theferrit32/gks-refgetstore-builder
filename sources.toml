# An undocumented knownrefseq GBFF file is intentionally excluded. Backfill a
# missing accession.version through an authoritative per-accession service
# rather than adding an undocumented bulk artifact.

# ---------------------------------------------------------------------------
# Ensembl human releases 75-116
# ---------------------------------------------------------------------------
# Releases are intentionally listed oldest to newest. Each release is one
# transactional seqset containing the four canonical, non-redundant FASTA
# representations: unmasked dna.toplevel, cDNA, ncRNA, and peptide. The build
# publishes the complete release under ensembl-N and atomically replaces the
# generic ensembl namespace only after all four files have been ingested.
# Ensembl CHECKSUMS files publish BSD-sum checksums and 1 KiB block counts.
# CDS, masked DNA, and chromosome/primary-assembly subsets are excluded.
#
# Releases 76-109 carry an `exclude` rule for their dna.toplevel file. Those
# releases emit each alt locus and patch scaffold at the full length of its
# parent chromosome, padding everything outside the placed interval with N and
# prefixing the name with CHR_. Release 110 switched to true-length records.
# The padding is ~95% of those files' content and, because N forces the store's
# 3-bit alphabet, ~21 GiB of the store, while encoding nothing the store does
# not already hold at true length: all 445 padded records have a true-length
# counterpart, and re-hashing the real span of each reproduces its digest
# exactly. The CHR_ prefix is Ensembl's own marker for this representation and
# is both sound and complete across 76-109, so the rule needs no content
# inspection. See seqrepo_equivalence/ENSEMBL_N_PADDED_SCAFFOLDS.md.

