# Like the RefSeq history above: the single pinned release (r113) carries only
# current ENST/ENSP versions, but seqrepo accumulated versions across many
# releases. Ensembl archives every release at pub/release-N/, so a spanning set
# of prior GRCh38 releases (plus r75, the last mainline GRCh37 release)
# recovers superseded ENST.N/ENSP.N versions. Same-basename files across
# releases are disambiguated by the download-cache URL hash. Tune the release
