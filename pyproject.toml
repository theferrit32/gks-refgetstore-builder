[project]
name = "gks-refgetstore-builder"
version = "0.1.0"
description = "Build a gtars RefgetStore archive (NCBI + Ensembl) with the per-sequence and per-collection aliases GA4GH tools need to use refget as an alias backend."
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "gtars>=0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]

[project.scripts]
gks-refgetstore = "gks_refgetstore.cli:main"
gks-refgetstore-check = "gks_refgetstore.verify_store:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gks_refgetstore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
