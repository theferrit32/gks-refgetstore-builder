[project]
name = "gks-refgetstore-builder"
version = "0.1.0"
description = "Build a gtars RefgetStore archive (NCBI + Ensembl) with the per-sequence and per-collection aliases GA4GH tools need to use refget as an alias backend."
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "gtars>=0.8.0",
]

[project.scripts]
gks-refgetstore = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "cli.py",
    "build_store.py",
    "build_lock.py",
    "fetch_sources.py",
    "generate_ncbi_source_candidates.py",
    "sources.toml",
]
