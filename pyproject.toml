[project]
name = "gks-refgetstore-builder"
version = "0.1.0"
description = "Build a gtars RefgetStore archive (NCBI + Ensembl) with the per-sequence and per-collection aliases GA4GH tools need to use refget as an alias backend."
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "gtars>=0.11.0",
]

[tool.uv.sources]
# gtars is built from source at a pinned commit until a release includes
# databio/gtars#273 (sequences that change when stored in encoded mode). The
# commit is that PR's head plus one fix so the Python bindings compile; see
# README.md "gtars revision". Building it needs a Rust toolchain.
gtars = { git = "https://github.com/theferrit32/gtars", rev = "7831e09f596042e3983c7a123c3f6c019ca6c05f", subdirectory = "gtars-python" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]

[project.scripts]
gks-refgetstore = "gks_refgetstore.cli:main"
gks-refgetstore-check = "gks_refgetstore.verify_store:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gks_refgetstore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
